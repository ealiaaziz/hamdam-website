# Runs on every push and pull request.
#
# This exists because there is no deploy automation on this project and never
# will be by default: production is a manual `npm run deploy`, so nothing was
# ever going to catch a broken build except a person remembering to look. CI
# does not deploy and must never deploy. It only answers "would this build, and
# is the content still valid" before a human runs the deploy themselves.
#
# The dash check enforces project hard rule 3 (no U+2014 / U+2013). It was added
# alongside the S1 sweep that removed the 36 existing violations, so it has been
# green from its first run.

name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` runs the "prepare" script, which points core.hooksPath at the
      # repo's git hooks. Harmless on a runner, but it is why this is `ci` and
      # not `ci --ignore-scripts`.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Persian byte check
        run: npm run check:persian

      - name: Dash check
        run: npm run check:dashes

  # The support desk is a separate package with its own dependencies, its own
  # wrangler config, and its own manual deploy. It deliberately does not ride
  # along on the site's build or test run (see vitest.config.js for why), so
  # it gets its own job. Same rule as above: this verifies, it never deploys.
  support:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
