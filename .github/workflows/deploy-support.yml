# Manual, gated deploy of the support desk Worker.
#
# The sibling ci.yml says CI must never deploy, and that rule is still right
# for the marketing site: that one deploys itself on every push, so a second
# automatic path would just be a second way to be surprised. This workflow is
# the deliberate exception, and it is narrow on purpose.
#
# It only ever runs when somebody asks for it by name. There is no `push`
# trigger and there must never be one.
#
# The credential never leaves GitHub. CLOUDFLARE_API_TOKEN is a repository
# secret and nothing in this repository ever holds its value.
#
# It must be a USER API token, created at My Profile then API Tokens, not an
# account-owned one from Manage Account. `wrangler whoami` tells you which you
# have: an account-owned token prints "an Account API Token". The "Edit
# Cloudflare Workers" template includes User Details Read and User Memberships
# Read, and user-scoped permissions cannot exist on an account-owned token at
# all, so no amount of widening an account token fixes it.
name: Deploy support desk

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy'
        required: true
        default: 'main'
      confirm:
        description: 'Type deploy to confirm. Anything else is a no-op.'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-support
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: support
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dry run
        run: npx wrangler deploy --dry-run

      # Asks Cloudflare the three questions wrangler's error cannot separate.
      # `Authentication error [code: 10000]` is returned both for a token that
      # lacks a permission and for a token pointed at an account it cannot see,
      # and the message is identical, which is how three deploys were spent
      # guessing.
      #
      # The accounts check works with GitHub's secret masking rather than
      # against it. Any id equal to CLOUDFLARE_ACCOUNT_ID is redacted to ***,
      # so a correct id is invisible and a wrong one prints in the clear. A
      # visible hex id in that output is proof the secret names the wrong
      # account, and nothing secret is disclosed either way.
      - name: Diagnose token and account
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo '=== 1. Is the token itself valid, and what is its status ==='
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 600
          echo; echo
          echo '=== 2. Which accounts can this token see ==='
          echo 'An id shown as *** matches CLOUDFLARE_ACCOUNT_ID and is correct.'
          echo 'An id shown in clear hex does NOT match, and is the bug.'
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts | head -c 900
          echo; echo
          echo '=== 3. The exact endpoint wrangler fails on, called directly ==='
          curl -sS -o /tmp/svc.json -w 'HTTP %{http_code}\n' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/hamdam-support"
          head -c 600 /tmp/svc.json
          echo

      - name: Token scopes
        continue-on-error: true
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `npx wrangler deploy`, not `npm run deploy`. predeploy-check.mjs refuses
      # a dirty tree or an unpushed branch, which is right on a laptop and
      # meaningless on a runner checking out a named ref from origin. It also
      # reads the branch name, which is `HEAD` on a detached checkout, so it
      # would block every run.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that returns success and a desk that answers are two different
      # claims. Check the second one.
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' https://support.hamdam.com.au/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy on attempt $attempt:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt returned $code, retrying in 10s"
            sleep 10
          done
          echo 'Deploy published but /health did not return 200. Consider: npx wrangler rollback'
          exit 1
